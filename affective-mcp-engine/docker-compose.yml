version: '3.8'
services:
  redis:
    image: redis:7-alpine
    container_name: affective_redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: affective_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: unless-stopped
